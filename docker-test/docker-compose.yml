services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
  idempiere:
    image: idempiereofficial/idempiere:12-release
    depends_on:
      - postgres
    entrypoint:
      - bash
      - -c
      - |
        cp /custom-plugins/*.jar /opt/idempiere/plugins/
        grep -q multilang /opt/idempiere/configuration/org.eclipse.equinox.simpleconfigurator/bundles.info 2>/dev/null ||           echo 'tw.idempiere.multilang.search,1.0.0.202604251155,plugins/tw.idempiere.multilang.search_1.0.0.202604251155.jar,4,false' >> /opt/idempiere/configuration/org.eclipse.equinox.simpleconfigurator/bundles.info
        exec ./docker-entrypoint.sh idempiere
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: idempiere
      DB_USER: adempiere
      DB_PASS: adempiere
      DB_ADMIN_PASS: postgres
    ports:
      - "8080:8080"
    volumes:
      - ./plugin-jar:/custom-plugins:ro
volumes:
  pgdata:
